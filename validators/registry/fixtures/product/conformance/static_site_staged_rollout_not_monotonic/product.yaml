ai_restrictions:
  ai_processing_permitted: true
  basis: Section 36.4 default posture
  restricted_paths: []
ai_runtime_dependency: null
assignments: []
automated_containment: null
business:
  active_customers: 1200
  criticality: high
  revenue_importance: high
classification:
  class: commercial
  domain: payments
  reliability_criticality: high
code:
  accepts_external_contributions: false
  default_branch: main
  gsd_version: v1.4.0
  repositories:
  - deploys: true
    name: acme/conf-fixture
    role: primary
commitments: []
conformance_profile: static-site
contract_version: 2
data: null
dependencies:
  external: []
  infrastructure: []
  internal: []
deployment:
  artifact_registry: ghcr.io/acme
  artifact_type: container-image
  build: github-actions
  progressive_delivery: staged-rollout
  rollback_method: halt-staged-rollout
  rollback_supported: true
  staged_rollout:
    advancer: release-manager
    crash_free_sessions:
      sev1_below_pct: 0.1
      sev2_below_pct: 1.0
    observation_window_hours: 24
    stages_pct:
    - 50
    - 30
    - 100
environments:
  local: docker-compose
  production: https://conf-fixture.internal
  staging: https://conf-fixture.staging.internal
escalation: role-eng-lead
identity:
  created: '2024-01-15'
  display_name: Conformance Fixture Service
  id: conf-static-site-not-mono
  launch_status: launched
  lifecycle: active
infrastructure:
  cache: redis-7
  database: postgres-14
  monthly_budget_band:
    ceiling: 900.0
    currency: USD
    expected: 500.0
  provider: aws
  provider_outage_behaviour: degrade-read-only
  region: eu-west-1
  runtime: python3.11
observability:
  alert_channel: '#conf-fixture-alerts'
  health_endpoint: /healthz
  metrics: /metrics
  telemetry_exposure: private-authenticated
  version_endpoint: /version
operations:
  backup_responder: null
  coverage_window: null
  critical_incident_response: Page the on-call rotation via PagerDuty; Section 15.1
    default.
  detection_expectation: next-business-morning
  intake_channel: '#conf-intake'
  primary_responder: null
  support_model: business-hours
  triager: triage-lead-1
  weekend_exception_eligible: false
platform_compatibility: supported
recovery: null
reversibility_default: fully-reversible
security:
  production_db_access: break-glass-only
  scorecard_minimum: 7.0
  secrets_location: vault:/acme/conf-fixture
verification:
  automated: required
  contract_path: verification/contract.yaml
  manual_uat: not-applicable
  performance: optional
  smoke_tests: optional
