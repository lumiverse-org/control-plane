contract_version: 2
platform_compatibility: supported
conformance_profile: service
identity:
  id: checkout-svc
  display_name: Checkout Service
  lifecycle: active
  launch_status: launched
  created: '2024-01-15'
classification:
  class: commercial
  reliability_criticality: high
  domain: payments
assignments: []
escalation: role-eng-lead
code:
  repositories:
  - name: acme/checkout-svc
    role: primary
    deploys: true
  default_branch: main
  gsd_version: v1.4.0
  accepts_external_contributions: false
verification:
  automated: required
  manual_uat: not-applicable
  smoke_tests: optional
  performance: optional
  contract_path: verification/contract.yaml
environments:
  local: docker-compose
  staging: https://checkout-svc.staging.internal
  production: https://checkout-svc.internal
deployment:
  build: github-actions
  artifact_type: container-image
  artifact_registry: ghcr.io/acme
  rollback_supported: true
  rollback_method: redeploy-previous-tag
  progressive_delivery: canary
  staged_rollout: null
reversibility_default: fully-reversible
commitments: []
recovery:
  backup_frequency: daily
  backup_retention_days: 30
  encrypted: true
  storage_location: AWS S3 ap-south-1 (separate account)
  restore_procedure: Run ops/restore.sh with backup ID
  restore_environment: staging-restore.recovery-fixture.internal
  integrity_check: SHA-256 checksum on backup file
  restore_tested: '2026-08-20'
  rpo_minutes: 60
  rto_minutes: 120
