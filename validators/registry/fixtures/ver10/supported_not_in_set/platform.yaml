#   hits under contracts/ are contracts/stubs/platform.yaml and
#   contracts/fixtures/C-REG-PLATFORM-1/*, which are test stub/fixture data
#   (current: "v1.0.0") for a draft contract (C-REG-PLATFORM-1) whose own
#   shape (platform_version as integer const 1, event_types as
#   {id, retired} objects) conflicts with the platform.registry.v1 schema
#   this file is validated against. Lane 1 does not invent a workflow tag,
#   so this seeds empty per the task's fallback branch.
# - event_type is owned by Lane 4 (L1-D05), but contracts/event-types.yaml
#   is explicitly "the authoritative source for all lanes" (FD-Q12) and is
#   shape-compatible (flat array of strings) with this schema's event_type
#   field, so it is seeded verbatim from that file (111 unique identifiers:
#   the FD-Q12 system meta-event set plus the closed C-EVT-ENUM-1 89-id
#   enum, de-duplicated as contracts/event-types.yaml already does).
