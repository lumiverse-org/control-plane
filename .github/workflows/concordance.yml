# Concordance check workflow — runs on push to main and PRs
name: concordance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  concordance:
    name: Concordance Check (5-lane)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run concordance check
        run: bash _concordance-check.sh lanes
      # Handover verification (verify_handover.sh) is a local/pre-Phase-0 check, not
      # something CI can run: the script lives outside this repo's checkout and reads
      # files from sibling planning directories that are not part of this repository.
