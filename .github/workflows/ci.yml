name: ci

on:
  workflow_call:
    inputs:
      job:
        description: "The job to run (or empty to run all). When set, non-matching jobs record explicit success and exit 0."
        type: string
        required: false
        default: ""
      product_name:
        description: "The product name from product.yaml"
        type: string
        required: true
      conformance_profile:
        description: "Conformance profile for the product (e.g., standard, strict)"
        type: string
        required: false
        default: "standard"
      default_branch:
        description: "The product repository default branch"
        type: string
        required: false
        default: "main"
      security_scanner_image:
        type: string
        required: false
        default: ""
      security_scanner_digest:
        type: string
        required: false
        default: ""
      security_scanner_sarif_path:
        type: string
        required: false
        default: "security-findings.json"
      security_baseline_path:
        type: string
        required: false
        default: "verification/security-baseline.json"
      licence_scanner_image:
        type: string
        required: false
        default: ""
      licence_scanner_digest:
        type: string
        required: false
        default: ""
      licence_scanner_report_path:
        type: string
        required: false
        default: "licence-findings.json"
      licence_policy_path:
        type: string
        required: false
        default: ""
      licence_baseline_path:
        type: string
        required: false
        default: "verification/licence-baseline.json"
      slopsquat_baseline_path:
        type: string
        required: false
        default: "verification/slopsquat-baseline.json"
      contract_validator_entrypoint:
        type: string
        required: false
        default: ""
      registry_validator_entrypoint:
        type: string
        required: false
        default: ""
      run_verification_contract:
        type: string
        required: false
        default: "true"
      reliability_criticality:
        type: string
        required: false
        default: "standard"
      run_seeded_defect:
        type: string
        required: false
        default: "true"
      seeded_defect_result_path:
        type: string
        required: false
        default: "verification/seeded-results.json"
      workflows_ref:
        description: "Control-plane ref that contains this workflow file and its tools."
        type: string
        required: false
        default: "workflows/v5"
    secrets:
      CONTROL_PLANE_TOKEN:
        description: "Read-only token for the control-plane repository"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.product_name }}-${{ inputs.job }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run unit tests
        run: |
          set -euo pipefail
          JOB="${{ inputs.job }}"
          if [ -n "${JOB}" ] && [ "${JOB}" != "unit-tests" ]; then
            echo "REASON: job '${JOB}' targeted, skipping unit-tests — explicit recorded success (§33.2)"
            exit 0
          fi
          if [ ! -f Makefile ]; then
            echo "REASON: no Makefile present — no unit test suite declared"
            echo "CONCLUSION: success (no suite)"
            exit 0
          fi
          if ! grep -q '^test:' Makefile && ! grep -q '^unit-test:' Makefile; then
            echo "REASON: Makefile has no 'test' or 'unit-test' target — no unit test suite declared"
            echo "CONCLUSION: success (no suite)"
            exit 0
          fi
          make test
        shell: bash

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run integration tests
        run: |
          set -euo pipefail
          JOB="${{ inputs.job }}"
          if [ -n "${JOB}" ] && [ "${JOB}" != "integration-tests" ]; then
            echo "REASON: job '${JOB}' targeted, skipping integration-tests — explicit recorded success (§33.2)"
            exit 0
          fi
          if [ ! -f Makefile ]; then
            echo "REASON: no Makefile present — no integration test suite declared"
            echo "CONCLUSION: success (no suite)"
            exit 0
          fi
          if ! grep -q '^integration:' Makefile && ! grep -q '^integration-test:' Makefile; then
            echo "REASON: Makefile has no 'integration' or 'integration-test' target — no integration test suite declared"
            echo "CONCLUSION: success (no suite)"
            exit 0
          fi
          make integration
        shell: bash

  build:
    name: build
    # L2-T121: delegates to the existing .github/workflows/build.yml (L2-T120).
    # identity_mode is hard-coded to "digest" — the only mode exercised anywhere
    # in this repo today (templates/workflows/build.yml does the same).
    # control_plane_ref reuses the caller-supplied default_branch input; there is
    # no better ref source on ci.yml's current input surface. Replace this if a
    # dedicated ref input is ever added upstream.
    uses: ./.github/workflows/build.yml
    with:
      product: ${{ inputs.product_name }}
      identity_mode: digest
      control_plane_ref: ${{ inputs.default_branch }}
      image_repo: ghcr.io/${{ github.repository }}
      job: ${{ inputs.job }}
    secrets:
      control_plane_read_token: ${{ secrets.CONTROL_PLANE_TOKEN || secrets.GITHUB_TOKEN }}

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Job target check
        shell: bash
        run: |
          set -euo pipefail
          JOB="${{ inputs.job }}"
          if [ -n "${JOB}" ] && [ "${JOB}" != "security-scan" ]; then
            echo "REASON: job '${JOB}' targeted, skipping security-scan — explicit recorded success (§33.2)"
            exit 0
          fi
          echo "Executing security-scan"

      - name: Checkout
        if: ${{ inputs.job == '' || inputs.job == 'security-scan' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout control-plane tools
        if: ${{ inputs.job == '' || inputs.job == 'security-scan' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/control-plane
          ref: ${{ inputs.workflows_ref }}
          path: control-plane
          fetch-depth: 1

      - name: Set up Python
        if: ${{ inputs.job == '' || inputs.job == 'security-scan' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install evidence toolchain
        if: ${{ inputs.job == '' || inputs.job == 'security-scan' }}
        run: pip install -r control-plane/tools/evidence/requirements.txt

      - name: Run security scanner
        if: ${{ inputs.job == '' || inputs.job == 'security-scan' }}
        id: scan
        env:
          SCANNER_IMAGE: ${{ inputs.security_scanner_image }}
          SCANNER_DIGEST: ${{ inputs.security_scanner_digest }}
          SARIF_PATH: ${{ inputs.security_scanner_sarif_path }}
        run: |
          set -euo pipefail
          if [ -z "${SCANNER_IMAGE:-}" ]; then
            set -a
            # FD-107 pins. An empty caller input reads that decision.
            . control-plane/templates/workflows/scan-tools.env
            set +a
            SCANNER_IMAGE="${SECURITY_SCANNER_IMAGE}"
            SCANNER_DIGEST="${SECURITY_SCANNER_DIGEST}"
          fi
          if [ -z "${SCANNER_IMAGE:-}" ] || [ -z "${SCANNER_DIGEST:-}" ]; then
            echo "ERROR: security scanner image and digest are unset" >&2
            exit 3
          fi
          docker pull "${SCANNER_IMAGE}@${SCANNER_DIGEST}"
          docker run --rm \
            --pull=never \
            -v "$(pwd):/workspace" \
            "${SCANNER_IMAGE}@${SCANNER_DIGEST}" \
            fs --format json --output /workspace/trivy-security.json \
            --skip-dirs control-plane \
            /workspace
          SARIF_PATH="${SARIF_PATH}" python - <<'PY'
          import json, os
          doc = json.load(open("trivy-security.json", encoding="utf-8"))
          findings = []
          for result in doc.get("Results") or []:
              target = result.get("Target") or ""
              for vuln in result.get("Vulnerabilities") or []:
                  vid = vuln.get("VulnerabilityID") or ""
                  pkg = vuln.get("PkgName") or ""
                  findings.append({
                      "id": f"{vid}|{pkg}|{target}",
                      "rule": vid,
                      "package": pkg,
                      "location": target,
                  })
          out = os.environ["SARIF_PATH"]
          os.makedirs(os.path.dirname(out) or ".", exist_ok=True)
          with open(out, "w", encoding="utf-8") as fh:
              json.dump({"findings": findings}, fh, indent=2)
              fh.write("\n")
          print(f"FINDINGS {len(findings)} written to {out}")
          PY
          echo "FINDINGS_PATH=${SARIF_PATH}" >> "$GITHUB_OUTPUT"

      - name: Delta gate — new findings only
        if: ${{ inputs.job == '' || inputs.job == 'security-scan' }}
        env:
          FINDINGS: ${{ steps.scan.outputs.FINDINGS_PATH }}
          BASELINE: ${{ inputs.security_baseline_path }}
        run: |
          set -euo pipefail
          PYTHONPATH=control-plane python -m tools.evidence.delta_gate \
            --baseline "${BASELINE}" \
            --current "${FINDINGS}"

  licence-scan:
    name: licence-scan
    runs-on: ubuntu-latest
    steps:
      - name: Job target check
        shell: bash
        run: |
          set -euo pipefail
          JOB="${{ inputs.job }}"
          if [ -n "${JOB}" ] && [ "${JOB}" != "licence-scan" ]; then
            echo "REASON: job '${JOB}' targeted, skipping licence-scan — explicit recorded success (§33.2)"
            exit 0
          fi
          echo "Executing licence-scan"

      - name: Checkout
        if: ${{ inputs.job == '' || inputs.job == 'licence-scan' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout control-plane tools
        if: ${{ inputs.job == '' || inputs.job == 'licence-scan' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/control-plane
          ref: ${{ inputs.workflows_ref }}
          path: control-plane
          fetch-depth: 1

      - name: Set up Python
        if: ${{ inputs.job == '' || inputs.job == 'licence-scan' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install evidence toolchain
        if: ${{ inputs.job == '' || inputs.job == 'licence-scan' }}
        run: pip install -r control-plane/tools/evidence/requirements.txt

      - name: Run licence scanner
        if: ${{ inputs.job == '' || inputs.job == 'licence-scan' }}
        id: scan
        env:
          SCANNER_IMAGE: ${{ inputs.licence_scanner_image }}
          SCANNER_DIGEST: ${{ inputs.licence_scanner_digest }}
          REPORT_PATH: ${{ inputs.licence_scanner_report_path }}
          POLICY_PATH: ${{ inputs.licence_policy_path }}
        run: |
          set -euo pipefail
          if [ -z "${SCANNER_IMAGE:-}" ]; then
            set -a
            # FD-107 pins. An empty caller input reads that decision.
            . control-plane/templates/workflows/scan-tools.env
            set +a
            SCANNER_IMAGE="${LICENCE_SCANNER_IMAGE}"
            SCANNER_DIGEST="${LICENCE_SCANNER_DIGEST}"
          fi
          if [ -z "${SCANNER_IMAGE:-}" ] || [ -z "${SCANNER_DIGEST:-}" ]; then
            echo "ERROR: licence scanner image and digest are unset" >&2
            exit 3
          fi
          docker pull "${SCANNER_IMAGE}@${SCANNER_DIGEST}"
          docker run --rm \
            --pull=never \
            -v "$(pwd):/workspace" \
            "${SCANNER_IMAGE}@${SCANNER_DIGEST}" \
            fs --scanners license --format json --output /workspace/trivy-licence.json \
            --skip-dirs control-plane \
            /workspace
          REPORT_PATH="${REPORT_PATH}" python - <<'PY'
          import json, os
          doc = json.load(open("trivy-licence.json", encoding="utf-8"))
          findings = []
          for result in doc.get("Results") or []:
              target = result.get("Target") or ""
              for lic in result.get("Licenses") or []:
                  name = lic.get("Name") or lic.get("Category") or ""
                  pkg = lic.get("PkgName") or ""
                  findings.append({
                      "id": f"{name}|{pkg}|{target}",
                      "rule": name,
                      "package": pkg,
                      "location": target,
                  })
          out = os.environ["REPORT_PATH"]
          os.makedirs(os.path.dirname(out) or ".", exist_ok=True)
          with open(out, "w", encoding="utf-8") as fh:
              json.dump({"findings": findings}, fh, indent=2)
              fh.write("\n")
          print(f"FINDINGS {len(findings)} written to {out}")
          PY
          echo "FINDINGS_PATH=${REPORT_PATH}" >> "$GITHUB_OUTPUT"

      - name: Delta gate — new licence findings only
        if: ${{ inputs.job == '' || inputs.job == 'licence-scan' }}
        env:
          FINDINGS: ${{ steps.scan.outputs.FINDINGS_PATH }}
          BASELINE: ${{ inputs.licence_baseline_path }}
        run: |
          set -euo pipefail
          PYTHONPATH=control-plane python -m tools.evidence.delta_gate \
            --baseline "${BASELINE}" \
            --current "${FINDINGS}"

  slopsquat-check:
    name: slopsquat-check
    runs-on: ubuntu-latest
    steps:
      - name: Job target check
        shell: bash
        run: |
          set -euo pipefail
          JOB="${{ inputs.job }}"
          if [ -n "${JOB}" ] && [ "${JOB}" != "slopsquat-check" ]; then
            echo "REASON: job '${JOB}' targeted, skipping slopsquat-check — explicit recorded success (§33.2)"
            exit 0
          fi
          echo "Executing slopsquat-check"

      - name: Checkout
        if: ${{ inputs.job == '' || inputs.job == 'slopsquat-check' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout control-plane tools
        if: ${{ inputs.job == '' || inputs.job == 'slopsquat-check' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/control-plane
          ref: ${{ inputs.workflows_ref }}
          path: control-plane
          fetch-depth: 1

      - name: Set up Python
        if: ${{ inputs.job == '' || inputs.job == 'slopsquat-check' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install evidence toolchain
        if: ${{ inputs.job == '' || inputs.job == 'slopsquat-check' }}
        run: pip install -r control-plane/tools/evidence/requirements.txt

      - name: Slopsquat legitimacy check (execute time)
        if: ${{ inputs.job == '' || inputs.job == 'slopsquat-check' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          CHANGED_LOCKFILES="$(git diff --name-only "${BASE_REF}...HEAD" -- \
            '*.lock' 'package-lock.json' 'yarn.lock' 'Pipfile.lock' 'poetry.lock' \
            'Gemfile.lock' 'requirements*.txt' 'go.sum' 'pom.xml' 'build.gradle' \
            'build.gradle.kts' 'pyproject.toml' 'Cargo.lock' 'composer.lock' \
            'package.json' '*.gemspec' 'setup.cfg' 'setup.py' 2>/dev/null || true)"

          if [ -z "$CHANGED_LOCKFILES" ]; then
            echo "INFO: no lockfile or manifest changes in this pull request — explicit success, no legitimacy check needed"
            exit 0
          fi

          echo "Changed lockfiles/manifests:"
          echo "$CHANGED_LOCKFILES"
          python -c "import sys, json; files = '''$CHANGED_LOCKFILES'''.splitlines(); print(json.dumps([{'id': f, 'path': f} for f in files if f]))" > /tmp/slopsquat-current.json

          PYTHONPATH=control-plane python -m tools.evidence.delta_gate \
            --baseline "${{ inputs.slopsquat_baseline_path }}" \
            --current /tmp/slopsquat-current.json

  contract-validation:
    name: contract-validation
    runs-on: ubuntu-latest
    steps:
      - name: Job target check
        shell: bash
        run: |
          set -euo pipefail
          JOB="${{ inputs.job }}"
          if [ -n "${JOB}" ] && [ "${JOB}" != "contract-validation" ]; then
            echo "REASON: job '${JOB}' targeted, skipping contract-validation — explicit recorded success (§33.2)"
            exit 0
          fi
          echo "Executing contract-validation"

      - name: Checkout
        if: ${{ inputs.job == '' || inputs.job == 'contract-validation' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout control-plane tools
        if: ${{ inputs.job == '' || inputs.job == 'contract-validation' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/control-plane
          ref: ${{ inputs.workflows_ref }}
          path: control-plane
          fetch-depth: 1

      - name: Set up Python
        if: ${{ inputs.job == '' || inputs.job == 'contract-validation' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install evidence toolchain
        if: ${{ inputs.job == '' || inputs.job == 'contract-validation' }}
        run: pip install -r control-plane/tools/evidence/requirements.txt -r control-plane/validators/registry/requirements.txt

      - name: Assert §33.1 required-file presence
        if: ${{ inputs.job == '' || inputs.job == 'contract-validation' }}
        run: |
          set -euo pipefail
          FAILED=0

          check_file() {
            local label="$1"; local path="$2"
            if [ -e "$path" ]; then
              echo "REQUIRED_FILE: PRESENT ${label}"
            else
              echo "REQUIRED_FILE: MISSING ${label}" >&2
              FAILED=$((FAILED + 1))
            fi
          }

          check_file ".env.example"             ".env.example"
          check_file "docker-compose.dev.yml"   "docker-compose.dev.yml"
          check_file "Makefile"                 "Makefile"
          check_file "seed data"                "$(find . -maxdepth 3 \( -name 'seed' -o -name 'seeds' -o -name 'seed_data' -o -name 'seed.json' -o -path './db/seeds' \) 2>/dev/null | head -1)"
          check_file "migration directory"      "$(find . -maxdepth 3 \( -name 'migrations' -o -path './db/migrate' \) 2>/dev/null | head -1)"
          check_file "verification/"            "verification/"
          check_file "AGENTS.md"                "AGENTS.md"
          check_file "product.yaml"             "$(find . -maxdepth 2 -name 'product.yaml' 2>/dev/null | head -1)"

          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: ${FAILED} required file(s) absent" >&2
            exit 1
          fi

      - name: Invoke Lane 1 contract validator
        if: ${{ inputs.job == '' || inputs.job == 'contract-validation' }}
        env:
          VALIDATOR_ENTRYPOINT: ${{ inputs.contract_validator_entrypoint }}
        run: |
          set -euo pipefail
          if [ -z "${VALIDATOR_ENTRYPOINT:-}" ]; then
            # bin/ is still empty. The published contract validator lives beside it
            # and is the check CP-0301 already runs against this contract.
            exec python control-plane/validators/registry/validate-verification-contract \
              --file verification/contract.yaml
          fi
          exec ${VALIDATOR_ENTRYPOINT}

  registry-validation:
    name: registry-validation
    runs-on: ubuntu-latest
    steps:
      - name: Job target check
        shell: bash
        run: |
          set -euo pipefail
          JOB="${{ inputs.job }}"
          if [ -n "${JOB}" ] && [ "${JOB}" != "registry-validation" ]; then
            echo "REASON: job '${JOB}' targeted, skipping registry-validation — explicit recorded success (§33.2)"
            exit 0
          fi
          echo "Executing registry-validation"

      - name: Checkout
        if: ${{ inputs.job == '' || inputs.job == 'registry-validation' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout control-plane tools
        if: ${{ inputs.job == '' || inputs.job == 'registry-validation' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/control-plane
          ref: ${{ inputs.workflows_ref }}
          path: control-plane
          fetch-depth: 1

      - name: Set up Python
        if: ${{ inputs.job == '' || inputs.job == 'registry-validation' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install evidence toolchain
        if: ${{ inputs.job == '' || inputs.job == 'registry-validation' }}
        run: pip install -r control-plane/tools/evidence/requirements.txt

      - name: Invoke Lane 1 registry and assignment validator
        if: ${{ inputs.job == '' || inputs.job == 'registry-validation' }}
        env:
          VALIDATOR_ENTRYPOINT: ${{ inputs.registry_validator_entrypoint }}
        run: |
          set -euo pipefail
          if [ -z "${VALIDATOR_ENTRYPOINT:-}" ]; then
            echo "ERROR: registry_validator_entrypoint input is empty — no published validator entrypoint yet (REG-018, validators/registry/bin/ is empty)" >&2
            exit 3
          fi
          exec ${VALIDATOR_ENTRYPOINT}

  parity-check:
    name: parity-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run parity check
        run: |
          set -euo pipefail
          JOB="${{ inputs.job }}"
          if [ -n "${JOB}" ] && [ "${JOB}" != "parity-check" ]; then
            echo "REASON: job '${JOB}' targeted, skipping parity-check — explicit recorded success (§33.2)"
            exit 0
          fi
          make parity
        shell: bash

  verification-contract:
    name: verification-contract
    runs-on: ubuntu-latest
    steps:
      - name: Job target check
        shell: bash
        run: |
          set -euo pipefail
          JOB="${{ inputs.job }}"
          if [ -n "${JOB}" ] && [ "${JOB}" != "verification-contract" ]; then
            echo "REASON: job '${JOB}' targeted, skipping verification-contract — explicit recorded success (§33.2)"
            exit 0
          fi
          echo "Executing verification-contract"

      - name: Checkout
        if: ${{ inputs.job == '' || inputs.job == 'verification-contract' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout control-plane tools
        if: ${{ inputs.job == '' || inputs.job == 'verification-contract' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/control-plane
          ref: ${{ inputs.workflows_ref }}
          path: control-plane
          fetch-depth: 1

      - name: Set up Python
        if: ${{ inputs.job == '' || inputs.job == 'verification-contract' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install evidence toolchain
        if: ${{ inputs.job == '' || inputs.job == 'verification-contract' }}
        run: pip install -r control-plane/tools/evidence/requirements.txt

      - name: Check verification contract
        if: ${{ inputs.job == '' || inputs.job == 'verification-contract' }}
        run: |
          set -euo pipefail
          # Cadence input: caller supplies whether this run is due.
          # The context is always emitted; no if: is used (§33.2).
          RUN_DUE="${{ inputs.run_verification_contract || 'true' }}"
          if [ "${RUN_DUE}" = "false" ]; then
            echo "Verification contract check not due this run — explicit recorded success (§33.2)"
            exit 0
          fi
          PYTHONPATH=control-plane python -m tools.evidence.verification_contract_check \
            --contract verification/contract.yaml \
            --criticality "${{ inputs.reliability_criticality || 'standard' }}" \
            --summary

  seeded-defect-case:
    name: seeded-defect-case
    runs-on: ubuntu-latest
    needs: [verification-contract]
    steps:
      - name: Job target check
        shell: bash
        run: |
          set -euo pipefail
          JOB="${{ inputs.job }}"
          if [ -n "${JOB}" ] && [ "${JOB}" != "seeded-defect-case" ]; then
            echo "REASON: job '${JOB}' targeted, skipping seeded-defect-case — explicit recorded success (§33.2)"
            exit 0
          fi
          echo "Executing seeded-defect-case"

      - name: Checkout
        if: ${{ inputs.job == '' || inputs.job == 'seeded-defect-case' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout control-plane tools
        if: ${{ inputs.job == '' || inputs.job == 'seeded-defect-case' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/control-plane
          ref: ${{ inputs.workflows_ref }}
          path: control-plane
          fetch-depth: 1

      - name: Set up Python
        if: ${{ inputs.job == '' || inputs.job == 'seeded-defect-case' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.4.0
        with:
          python-version: "3.12"

      - name: Execute seeded-defect case (inversion — §31.2)
        if: ${{ inputs.job == '' || inputs.job == 'seeded-defect-case' }}
        run: |
          set -euo pipefail
          RUN_DUE="${{ inputs.run_seeded_defect || 'true' }}"
          if [ "${RUN_DUE}" = "false" ]; then
            echo "Seeded-defect check not due this run — explicit recorded success (§33.2)"
            exit 0
          fi
          PYTHONPATH=control-plane python -m tools.evidence.seeded_defect \
            --result "${{ inputs.seeded_defect_result_path || 'verification/seeded-results.json' }}" \
            --summary
