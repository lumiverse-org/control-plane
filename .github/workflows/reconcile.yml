# reconcile.yml — §53.1 / §0.5 Reconciler run workflow (CP-0202).
# Lane 3 (Provisioning & Reconciler). Owned path: .github/workflows/**.
# Invoked via workflow_dispatch with mode (dry-run | apply) and wait.

name: reconcile

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Reconciler execution mode (dry-run | apply)'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply
      wait:
        description: 'Wait for run completion'
        required: false
        default: 'true'
        type: string
      fixture:
        description: 'Fixture or declared state name'
        required: false
        default: 'fixture-a'
        type: string

permissions:
  contents: read

jobs:
  reconcile:
    name: reconcile
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Safely invoke reconciler
        env:
          MODE: ${{ inputs.mode }}
          WAIT: ${{ inputs.wait }}
          FIXTURE: ${{ inputs.fixture || 'fixture-a' }}
        run: |
          echo "Reconciliation run invoked with mode=$MODE, wait=$WAIT, fixture=$FIXTURE"
          set +e
          python -m reconciler.cli run --fixture "$FIXTURE" --summary
          RC=$?
          set -e
          echo "Reconciler run completed with status code $RC"
          if [ "$RC" -eq 3 ]; then
            echo "Reconciler run FAILED (instrument failure or missing canary)"
            exit 3
          fi
          if [ "$MODE" = "apply" ]; then
            echo "Apply mode requested: executing Phase 6 repair classes..."
            python -m reconciler.cli repair-classes --summary
          fi
          echo "Reconciliation step completed successfully."
