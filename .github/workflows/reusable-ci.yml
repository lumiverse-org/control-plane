# Reusable CI workflow — L2-01, FD-084 (D-L2-07 integration criteria)
# Called by product workflows via: uses: ./.github/workflows/reusable-ci.yml
#
# NOTE ON DUPLICATION: lane-guard.yml's `lane-guard` job intentionally does
# NOT call this workflow — it re-implements the "Actor gate" / "Validate
# registry schemas" / "Run concordance check" steps below inline instead,
# because the branch-protection required check context must stay the
# literal string `lane-guard` (see lanes/L0-02-lane-guard.md and
# master/02-branch-merge-model.md §10.1/§10.3; a `uses:` call here would
# change the reported check name and orphan that required context). When
# changing the "Validate registry schemas", "Run concordance check", or
# "Actor gate" steps in the `validate` job below, mirror the change in
# lane-guard.yml's `lane-guard` job as well.
name: reusable-ci

on:
  workflow_call:
    inputs:
      product_id:
        required: true
        type: string
      environment:
        required: false
        type: string
        default: "ci"
      run_verification_contract:
        required: false
        type: string
        default: "true"
      reliability_criticality:
        required: false
        type: string
        default: "standard"
      run_seeded_defect:
        required: false
        type: string
        default: "true"
      seeded_defect_result_path:
        required: false
        type: string
        default: "verification/seeded-results.json"
    secrets:
      GITHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ inputs.product_id }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.4.0
        with:
          python-version: "3.12"

      - name: Validate registry schemas
        run: |
          python -m validators.registry.cli \
            --root registries/ \
            --as-of $(date +%Y-%m-%d) \
            --records-root records/ \
            --format json
        continue-on-error: true

      - name: Run concordance check
        run: bash _concordance-check.sh lanes
        continue-on-error: true

      - name: Actor gate
        run: bash scripts/actor-gate.sh
        env:
          PR_ACTOR: ${{ github.actor }}

  verification-contract:
    name: verification-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.4.0
        with:
          python-version: "3.12"

      - name: Check verification contract
        run: |
          set -euo pipefail
          # Cadence input: caller supplies whether this run is due.
          # The context is always emitted; no if: is used (§33.2).
          RUN_DUE="${{ inputs.run_verification_contract || 'true' }}"
          if [ "${RUN_DUE}" = "false" ]; then
            echo "Verification contract check not due this run — explicit recorded success (§33.2)"
            exit 0
          fi
          python -m tools.evidence.verification_contract_check \
            --contract verification/contract.yaml \
            --criticality "${{ inputs.reliability_criticality || 'standard' }}" \
            --summary

  seeded-defect-case:
    name: seeded-defect-case
    runs-on: ubuntu-latest
    needs: [verification-contract]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.4.0
        with:
          python-version: "3.12"

      - name: Execute seeded-defect case (inversion — §31.2)
        run: |
          set -euo pipefail
          # Cadence: caller supplies whether this run is due.
          # No if: on required context (§33.2).
          RUN_DUE="${{ inputs.run_seeded_defect || 'true' }}"
          if [ "${RUN_DUE}" = "false" ]; then
            echo "Seeded-defect check not due this run — explicit recorded success (§33.2)"
            exit 0
          fi
          python -m tools.evidence.seeded_defect \
            --result "${{ inputs.seeded_defect_result_path || 'verification/seeded-results.json' }}" \
            --summary

