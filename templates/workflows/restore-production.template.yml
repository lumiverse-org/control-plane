name: restore-production
# =====================================================================
# PER-PRODUCT PRODUCTION RESTORE WORKFLOW — generated by create-product.
# Spec: Section 44.5 (line 4016); Section 15.5 (line 1564);
#       Section 37.3 (line 3267); Section 39.5 (line 3589).
#
# PLACEHOLDERS, substituted at product creation by Lane 3:
#   {{PRODUCT_SLUG}}   the product's slug as it appears in product.yaml
#   {{TARGET_REPO}}    owner/repo of this product repository
#   {{RUNNER_LABEL}}   ubuntu-latest, unless the product records the D87 exception
#   {{SELF_HOSTED}}    "false", unless the product records the D87 exception
#
# workflow_dispatch ONLY. A `push:` trigger on a privileged workflow is one of
# the three Blocking drift rows of D87 (line 10180) and must never be added.
# NO `if:` and NO path filter anywhere in this file (Section 33.2, line 2860).
# =====================================================================
on:
  workflow_dispatch:
    inputs:
      backup_ref:
        description: 'Reference to the specific backup to restore from.'
        required: true
        type: string
      reason:
        description: 'Reason for the production restore.'
        required: true
        type: string
      authorised_by:
        description: 'Identity of the person authorising this production restore.'
        required: true
        type: string
      integrity_check:
        description: 'Result of the integrity check on the backup (pass/fail).'
        required: true
        type: string
      named_verifier:
        description: 'Identity of the named verifier who checked the backup integrity.'
        required: true
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  # >>> RESTORE-ENGINE v1 — FD-128
  restore-production:
    name: restore-production
    uses: lumiverse-org/control-plane/.github/workflows/restore-production.yml@workflows/v1
    with:
      product: '{{PRODUCT_SLUG}}'
      restore_target: production
      backup_ref: ${{ inputs.backup_ref }}
      authorised_by: ${{ inputs.authorised_by }}
      reason: ${{ inputs.reason }}
      integrity_check: ${{ inputs.integrity_check }}
      named_verifier: ${{ inputs.named_verifier }}
      actor: ${{ github.actor }}
      registry_ref: ${{ github.sha }}
      environment_name: production
      target_repo: '{{TARGET_REPO}}'
      deploy_ref: ${{ github.ref }}
      runner_label: '{{RUNNER_LABEL}}'
      privileged_self_hosted_declared: '{{SELF_HOSTED}}'
    secrets:
      REGISTRY_READ_TOKEN: ${{ secrets.REGISTRY_READ_TOKEN }}
      RECORDS_READ_TOKEN: ${{ secrets.RECORDS_READ_TOKEN }}
      RECORDS_WRITER_TOKEN: ${{ secrets.RECORDS_WRITER_TOKEN }}
      ENV_POLICY_READ_TOKEN: ${{ secrets.REGISTRY_READ_TOKEN }}
  # <<< RESTORE-ENGINE v1

