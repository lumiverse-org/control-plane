  - number: 106
    text: "Individual people-performance intelligence on the management surface (Layer B-M)\
  \ is Founder-only, gated by the `people-intelligence` capability, and **not delegable**;\
  \ the individual self-view (Layer B-S) carries one person's own evidence to that\
  \ person and is outside this rule. At the application and datasource layers this\
  \ is absolute. Host-level administrative access to the machine carrying the store\
  \ is not a grant of it and never confers the capability: it is the single named,\
  \ recorded accepted risk of Section 90.3, bounded by a stated compensating control\
  \ and a dated review."
