# checkout pinned at v0.22.4 (commit 4d04303818b61bf3aa09278af48356315515965b),
# per D69 ("tools.yaml, registered before first use... has no owning lane") and
# Section 62.1's verbatim three-entry shape (lanes/L1-02-schemas.md fixture).
